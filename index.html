<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>SainsKan — Belajar Sains Jadi Petualangan</title>
<style>
  :root{
    --bg:#f3f6ff; --bg2:#e8efff; --panel:#ffffff; --panel2:#f8faff;
    --text:#101a33; --muted:#5d6a88; --line:#dbe3f5;
    --blue:#2563eb; --blue2:#38bdf8; --cyan:#0891b2; --green:#16a34a;
    --amber:#d97706; --red:#dc2626; --violet:#7c3aed;
    --shadow:0 10px 30px rgba(30,64,175,.10);
    --radius:18px;
  }
  html[data-theme="dark"]{
    --bg:#060a14; --bg2:#0b1224; --panel:#0f172a; --panel2:#111c34;
    --text:#e8f0ff; --muted:#98a8c8; --line:#20304f;
    --blue:#3b82f6; --blue2:#38bdf8; --cyan:#22d3ee; --green:#34d399;
    --amber:#fbbf24; --red:#f87171; --violet:#a78bfa;
    --shadow:0 14px 36px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 88% -10%, color-mix(in srgb,var(--blue) 16%,transparent), transparent 60%),
      radial-gradient(700px 420px at -10% 8%, color-mix(in srgb,var(--cyan) 10%,transparent), transparent 62%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button,select,input{font:inherit}
  button{cursor:pointer}
  a{color:var(--blue);text-decoration:none}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .app{max-width:1380px;margin:0 auto;padding:16px clamp(12px,2.5vw,28px) 56px}
  .topbar{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;margin-bottom:18px;border:1px solid var(--line);border-radius:20px;
    background:var(--panel);
    background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px);box-shadow:var(--shadow)
  }
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
  .brand-mark{
    width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;
    background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(37,99,235,.35)
  }
  .brand-name{font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
  .brand-tag{font-size:11px;color:var(--muted);white-space:nowrap}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:650;white-space:nowrap
  }
  .chip b{color:var(--blue)}
  .icon-btn,.btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;
    padding:9px 13px;font-weight:700;font-size:13px;transition:transform .15s,background .15s,border-color .15s
  }
  .icon-btn:hover,.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
  .btn.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(37,99,235,.25)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
  .btn.small{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:18px;align-items:start}
  .nav{
    display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);position:sticky;top:88px
  }
  .nav-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px 4px}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;color:var(--muted);
    font-weight:650;font-size:14px;transition:.15s
  }
  .nav a:hover{background:var(--panel2);color:var(--text)}
  .nav a.active{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 22%,transparent),transparent);color:var(--blue)}
  .nav a .ico{width:22px;text-align:center;font-size:17px}
  .main{min-width:0}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
  .page-head h1{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:-.03em}
  .page-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
  .card{
    border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);min-width:0
  }
  .card h2,.card h3{margin:0 0 10px;letter-spacing:-.02em}
  .card h2{font-size:18px}
  .card h3{font-size:15px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stack{display:grid;gap:14px}
  .hero{
    position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:22px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 88%,#000),var(--violet));color:#fff;box-shadow:var(--shadow)
  }
  .hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:rgba(255,255,255,.10)}
  .hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
  .hero h1{margin:6px 0 4px;font-size:clamp(24px,4vw,38px);letter-spacing:-.035em}
  .hero p{margin:0;opacity:.88;font-size:14px;max-width:48ch}
  .level-badge{
    width:84px;height:84px;flex:none;display:grid;place-items:center;border-radius:22px;text-align:center;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)
  }
  .level-badge strong{display:block;font-size:28px;line-height:1}
  .level-badge span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.85}
  .xpbar{height:11px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:14px;position:relative;z-index:1}
  .xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#67e8f9,#fbbf24);transition:width .35s}
  .stat{display:flex;align-items:center;gap:11px}
  .stat-ico{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--panel2);font-size:18px}
  .stat b{display:block;font-size:19px;line-height:1.1}
  .stat span{font-size:11px;color:var(--muted)}
  .bar{height:9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .35s}
  .bar.green i{background:linear-gradient(90deg,var(--green),#a3e635)}
  .bar.violet i{background:linear-gradient(90deg,var(--violet),var(--blue2))}
  .bar.amber i{background:linear-gradient(90deg,var(--amber),#fb923c)}
  .cat-card{display:grid;gap:9px;cursor:pointer;transition:transform .15s}
  .cat-card:hover{transform:translateY(-3px)}
  .cat-top{display:flex;align-items:center;gap:10px}
  .cat-ico{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;font-size:21px;background:var(--panel2)}
  .cat-card b{font-size:15px}
  .cat-card .muted{font-size:11px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filter{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:700
  }
  .filter.active{background:var(--blue);color:#fff;border-color:transparent}
  .materi-card{overflow:hidden;padding:0;cursor:pointer;transition:transform .16s,box-shadow .16s;display:flex;flex-direction:column}
  .materi-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px rgba(30,64,175,.18)}
  .materi-card img{width:100%;height:132px;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
  .materi-body{padding:14px;display:grid;gap:7px;flex:1}
  .materi-body h3{margin:0;font-size:15px;line-height:1.3}
  .materi-body p{margin:0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .tag{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
  .tag.done{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
  .detail-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:18px}
  .detail-hero img{width:100%;height:100%;min-height:210px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
  .konten{display:grid;gap:8px;margin-top:8px}
  .konten p,.konten li{margin:0;font-size:14px;color:var(--muted)}
  .konten ul{margin:0;padding-left:20px;display:grid;gap:6px}
  .soal-num{font-size:12px;font-weight:800;color:var(--blue)}
  .option{
    display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:13px 14px;margin-top:9px;
    border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font-size:14px;transition:.15s
  }
  .option:hover{border-color:var(--blue);transform:translateX(2px)}
  .option .key{width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:12px}
  .option.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--panel2))}
  .option.benar{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--panel2))}
  .option.salah{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--panel2))}
  .feedback{border-radius:13px;padding:13px 15px;margin-top:12px;font-size:13px;border:1px solid var(--line);background:var(--panel2)}
  .feedback.ok{border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
  .feedback.bad{border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
  .feedback p{margin:5px 0 0;color:var(--muted)}
  .badge-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
  .badge-item.locked{opacity:.5;filter:grayscale(.7)}
  .badge-ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--panel);font-size:23px;border:1px solid var(--line)}
  .badge-item b{font-size:13px}
  .badge-item p{margin:2px 0 0;font-size:11px;color:var(--muted)}
  .leader{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}
  .leader.me{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--panel2))}
  .rank{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--panel);font-weight:800;font-size:12px}
  .leader .who{flex:1;min-width:0}
  .leader .who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .leader .who span{font-size:10px;color:var(--muted)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .sim-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
  canvas{width:100%;height:auto;display:block;border-radius:13px;background:#080f1f;border:1px solid var(--line)}
  .control{display:grid;gap:5px;margin-bottom:12px}
  .control label{font-size:11px;font-weight:750;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
  .control label b{color:var(--text)}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .readout{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .readout b{font-variant-numeric:tabular-nums}
  .note{font-size:11px;color:var(--muted);background:var(--panel2);border-left:3px solid var(--cyan);padding:9px 11px;border-radius:8px;margin-top:10px}
  .modal-bg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:rgba(2,6,20,.68);backdrop-filter:blur(4px)}
  .modal{width:min(430px,100%);border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
  .modal h2{margin:0 0 8px;font-size:19px}
  .modal p{margin:0 0 18px;font-size:13px;color:var(--muted)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .toast-host{position:fixed;right:16px;bottom:16px;z-index:100;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
  .toast{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px 14px;font-size:13px;font-weight:650;box-shadow:var(--shadow);animation:pop .2s ease-out;border-left:4px solid var(--blue)}
  .toast.good{border-left-color:var(--green)}
  .toast.warn{border-left-color:var(--amber)}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  /* Login & guru */
  .login-page{min-height:100vh;display:grid;place-items:center;padding:18px}
  .login-card{
    width:min(880px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)
  }
  .login-art{
    padding:30px;color:#fff;background:linear-gradient(150deg,#1d4ed8,#7c3aed);
    display:flex;flex-direction:column;justify-content:space-between;gap:18px
  }
  .login-art h1{font-size:clamp(26px,4vw,38px);margin:10px 0 6px;letter-spacing:-.035em}
  .login-art p{opacity:.9;font-size:14px;margin:0}
  .login-art .orb{font-size:82px;line-height:1;text-align:center;filter:drop-shadow(0 12px 22px rgba(0,0,0,.3))}
  .login-form{padding:30px;display:grid;align-content:center;gap:14px}
  .login-form h2{margin:0;font-size:22px}
  .field{display:grid;gap:6px}
  .field label{font-size:12px;font-weight:750;color:var(--muted)}
  .field input{
    width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px
  }
  .error{color:var(--red);font-size:12px;font-weight:700;min-height:17px}
  .hint{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--panel2)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .role-pill{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 16%,var(--panel2));color:var(--blue)}
  @media (max-width:640px){.login-card{grid-template-columns:1fr}.login-art{padding:22px}.login-art .orb{font-size:56px}.login-form{padding:22px}}
  @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  @media (max-width:980px){
    .layout{grid-template-columns:1fr}
    .nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:thin}
    .nav-title{display:none}
    .nav a{flex:none}
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sim-wrap{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .g3,.g4,.g2{grid-template-columns:1fr}
    .detail-hero{grid-template-columns:1fr}
    .topbar{padding:10px;gap:8px}
    .brand-tag{display:none}
    .brand-name{font-size:17px}
    .chip{font-size:11px;padding:6px 9px}
    .hero{padding:18px}
    .level-badge{width:68px;height:68px}
    .card{padding:15px}
  }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toasts" class="toast-host" aria-live="polite"></div>
<script src="./users.js"></script>
<script>
/* ============================================================
   SainsKan — prototipe lokal. Tanpa backend, tanpa CDN.
   Akun dibaca dari users.js (file terpisah).
   ============================================================ */
const STORAGE_KEY = 'sainskan.progress.v2';
const LEGACY_KEY = 'sainskan.progress.v1';
const SCHEMA = 2;
const G = 9.8;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupiah = (n) => Number(n).toLocaleString('id-ID');
const todayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const yesterdayStr = () => { const d = new Date(); d.setDate(d.getDate()-1); return todayStr(d); };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

function svgImage(kategori, seed){
  const pal = {
    Fisika:['#38bdf8','#2563eb'], Kimia:['#34d399','#059669'],
    Biologi:['#a3e635','#65a30d'], Astronomi:['#c084fc','#7c3aed']
  }[kategori] || ['#38bdf8','#2563eb'];
  const art = {
    Fisika:`<g fill="none" stroke="${pal[0]}" stroke-width="3" opacity=".85"><ellipse cx="210" cy="120" rx="130" ry="52" transform="rotate(-24 210 120)"/><ellipse cx="210" cy="120" rx="130" ry="52" transform="rotate(24 210 120)"/></g><circle cx="210" cy="120" r="26" fill="${pal[1]}"/><circle cx="325" cy="70" r="11" fill="#fbbf24"/><path d="M60 205h300" stroke="${pal[0]}" stroke-width="3" opacity=".5"/><path d="M120 190v-46m-7 8 7-9 7 9" stroke="#e8f0ff" stroke-width="3" fill="none"/>`,
    Kimia:`<g stroke="${pal[0]}" stroke-width="4" fill="none"><path d="M178 52h64v42l52 92a28 28 0 0 1-25 42h-118a28 28 0 0 1-25-42l52-92z"/><path d="M170 158h100"/></g><g fill="${pal[0]}" opacity=".85"><circle cx="200" cy="186" r="9"/><circle cx="232" cy="174" r="6"/><circle cx="218" cy="200" r="5"/><circle cx="246" cy="196" r="7"/></g><g stroke="${pal[1]}" stroke-width="2" fill="none" opacity=".7"><ellipse cx="90" cy="90" rx="34" ry="14"/><ellipse cx="90" cy="90" rx="34" ry="14" transform="rotate(60 90 90)"/><ellipse cx="90" cy="90" rx="34" ry="14" transform="rotate(120 90 90)"/></g><circle cx="90" cy="90" r="6" fill="#fbbf24"/>`,

function loadDB(){
  const kosong = {version:SCHEMA,session:null,progress:{},accounts:[]};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    let db = raw ? JSON.parse(raw) : null;
    if(!db || db.version!==SCHEMA || typeof db.progress!=='object') db = kosong;
    const tersimpan = Array.isArray(db.accounts) ? db.accounts : [];
    const tambahan = tersimpan
      .filter(u=>u && ['guru','siswa'].includes(u.role) && typeof u.username==='string')
      .map(u=>Object.assign({},u,{username:u.username.trim(),password:'123',custom:true,
        displayName:u.displayName||u.username.trim()}))
      .filter(u=>u.username && !BASE_ACCOUNTS.some(b=>b.username.toLowerCase()===u.username.toLowerCase()));
    const punya = n=>tambahan.some(u=>u.username.toLowerCase()===n.toLowerCase());
    [DEFAULT_GURU, ...DEFAULT_SISWA].forEach(u=>{ if(!punya(u.username)) tambahan.push(Object.assign({},u)); });
    ACCOUNTS = BASE_ACCOUNTS.concat(tambahan);
    db.accounts = ACCOUNTS.filter(u=>u.custom);
    if(!raw){
      try{
        const lama = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
        if(lama?.player?.namaAlias){
          const name = lama.player.namaAlias;
          db.progress[name] = Object.assign({}, lama, {version:SCHEMA,alias:name,
            player:Object.assign({},lama.player,{namaAlias:name})});
        }
      }catch(e){}
    }
    ACCOUNTS.filter(u=>u.role==='siswa').forEach(u=>{
      const s = db.progress[u.username];
      if(!s || !s.player || !s.progres){ db.progress[u.username] = defaultStateFor(u.username); return; }
      s.alias = u.username; s.player.namaAlias = u.username;
      s.player.badge = Array.isArray(s.player.badge)?s.player.badge:[];
      s.player.materiSelesai = Array.isArray(s.player.materiSelesai)?s.player.materiSelesai:[];
      s.simulasiDicoba = Array.isArray(s.simulasiDicoba)?s.simulasiDicoba:[];
      s.daily = Object.assign({},defaultStateFor(u.username).daily,s.daily||{});
      s.player.level = levelOf(Number(s.player.xp)||0);
      s.theme = ['dark','light'].includes(s.theme)?s.theme:'dark';
    });
    if(db.session && !ACCOUNTS.some(u=>u.username===db.session)) db.session = null;
    return db;
  }catch(e){
    queueMicrotask(()=>showToast('Data akun tidak valid — dimulai dari awal.','warn'));
    return kosong;
  }
}

function levelOf(xp){ return Math.floor(xp/100)+1; }
function skorTinggiCount(){ return Object.values(state.progres).filter(p=>p.awarded && p.skor >= 80).length; }
function kuisSelesaiCount(){ return Object.values(state.progres).filter(p=>p.awarded).length; }
function progressKategori(kat){
  const ids = MATERI.filter(m=>m.kategori===kat).map(m=>m.id);
  return {done:ids.filter(id=>state.player.materiSelesai.includes(id)).length,total:ids.length};
}
function syaratTerpenuhi(a){
  const s = a.syaratPencapaian, p = state.player;
  switch(s.type){
    case 'kuis': return kuisSelesaiCount() >= s.count;
    case 'skorTinggi': return skorTinggiCount() >= s.count;
    case 'kategoriLengkap': return progressKategori(s.kategori).done >= progressKategori(s.kategori).total;
    case 'level': return p.level >= s.value;
    case 'poin': return p.totalPoin >= s.value;
    case 'streak': return state.daily.streak >= s.value;
    case 'simulasi': return state.simulasiDicoba.length >= s.value;
    case 'materi': return p.materiSelesai.length >= s.value;
    default: return false;
  }
}
function evaluateBadges(){
  const baru = [];
  state.player.level = levelOf(state.player.xp);
  for(let pass=0; pass<ACHIEVEMENTS.length+1; pass++){
    let ada = false;
    for(const a of ACHIEVEMENTS){
      if(state.player.badge.includes(a.id) || !syaratTerpenuhi(a)) continue;
      state.player.badge.push(a.id);
      state.player.xp += 25;
      state.player.level = levelOf(state.player.xp);
      baru.push(a.id); ada = true;
    }
    if(!ada) break;
  }
  return baru;
}
function afterChange(badges){
  const names = badges.map(id=>ACHIEVEMENTS.find(a=>a.id===id)?.nama).filter(Boolean);
  names.forEach(n=>showToast('Badge baru: ' + n + '  +25 XP','good'));
  save();
}
function completeMateriQuiz(materiId, items, jawaban){
  const benar = jawaban.filter((j,i)=>j===items[i].jawabanBenar).length;
  const poinSoal = jawaban.reduce((sum,j,i)=>sum+(j===items[i].jawabanBenar?items[i].poin:0),0);
  const skor = pct(benar, items.length);
  let p = state.progres[materiId];
  if(!p){
    p = {pemainId:state.player.id,materiId,skor:0,status:'sedang',tanggalPenyelesaian:'',awarded:false,attempts:0,jawaban:{}};
    state.progres[materiId] = p;
  }
  p.attempts += 1;
  p.skor = Math.max(p.skor || 0, skor);
  p.status = 'selesai';
  p.tanggalPenyelesaian = todayStr();
  p.jawaban = {benar,total:items.length};
  let tambah = 0;
  if(!p.awarded){
    p.awarded = true;
    tambah = poinSoal + 20;
    state.player.totalPoin += tambah;
    state.player.xp += tambah;
    if(!state.player.materiSelesai.includes(materiId)) state.player.materiSelesai.push(materiId);
  }
  const badges = evaluateBadges();
  afterChange(badges);
  return {benar,total:items.length,skor,poinSoal,tambah,badges,duplikat:tambah===0};
}
function hashTanggal(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function dailyQuestions(tgl){
  const seed = hashTanggal(tgl), used = new Set(), out = [];
  [seed%SOAL.length,(seed+13)%SOAL.length,(seed+25)%SOAL.length].forEach(i=>{
    let k = i; while(used.has(k)) k = (k+1)%SOAL.length;
    used.add(k); out.push(SOAL[k]);
  });
  return out;
}
function completeDaily(items, jawaban){
  const benar = jawaban.filter((j,i)=>j===items[i].jawabanBenar).length;
  const tgl = todayStr();
  let tambah = 0;
  if(state.daily.tanggal !== tgl || !state.daily.selesai){
    tambah = 30;
    state.daily.streak = state.daily.terakhir === yesterdayStr() ? (state.daily.streak||0)+1 : 1;
    state.daily.tanggal = tgl; state.daily.selesai = true; state.daily.diambilAt = new Date().toISOString();
    state.daily.terakhir = tgl;
    state.player.totalPoin += tambah; state.player.xp += tambah;
  }
  const badges = evaluateBadges();
  afterChange(badges);
  return {benar,total:items.length,skor:pct(benar,items.length),tambah,badges,duplikat:tambah===0};
}

function gravReadouts(){
  const g = ui.sim.grav, t = Math.min(g.t,Math.sqrt(2*g.tinggi/G));
  return {mass:g.massa,height:g.tinggi,t:t.toFixed(2),v:(G*t).toFixed(2),ep:(g.massa*G*g.tinggi).toFixed(0)};
}
function circuitCalc(){
  const c = ui.sim.circ;
  if(c.mode==='seri'){
    const R=c.r1+c.r2, I=c.v/R;
    return {R,I,v1:I*c.r1,v2:I*c.r2,i1:I,i2:I,mode:'seri'};
  }
  const R=(c.r1*c.r2)/(c.r1+c.r2), I=c.v/R;
  return {R,I,v1:c.v,v2:c.v,i1:c.v/c.r1,i2:c.v/c.r2,mode:'paralel'};
}

function canvasSetup(c){
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const grd = ctx.createLinearGradient(0,0,c.width,c.height);
  grd.addColorStop(0,'#0a1226'); grd.addColorStop(1,'#070c1a');
  ctx.fillStyle = grd; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle = 'rgba(148,163,184,.07)'; ctx.lineWidth = 1;
  for(let x=0;x<c.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke();}
  for(let y=0;y<c.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}
  return ctx;
}
function drawGrav(){
  const c = document.getElementById('gravCanvas'); if(!c) return;
  const ctx = canvasSetup(c), g = ui.sim.grav;
  const groundY = c.height-46, topY = 34, usable = groundY-topY;
  const tf = Math.sqrt(2*g.tinggi/G), t = Math.min(g.t,tf);
  const turun = 0.5*G*t*t, sisa = Math.max(0,g.tinggi-turun);
  const y = groundY - (sisa/g.tinggi)*usable;
  ctx.strokeStyle='rgba(56,189,248,.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(70,topY); ctx.lineTo(70,groundY); ctx.stroke();
  ctx.fillStyle='#93c5fd'; ctx.font='12px sans-serif';
  for(let i=0;i<=4;i++){
    const yy = groundY-(i/4)*usable;
    ctx.beginPath();ctx.moveTo(64,yy);ctx.lineTo(76,yy);ctx.stroke();
    ctx.fillText(`${Math.round(g.tinggi*i/4)} m`,80,yy+4);
  }
  ctx.fillStyle='#1e293b'; ctx.fillRect(0,groundY,c.width,c.height-groundY);
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(c.width,groundY);ctx.stroke();
  ctx.beginPath();ctx.setLineDash([5,6]);ctx.moveTo(130,topY);ctx.lineTo(130,groundY);ctx.stroke();ctx.setLineDash([]);
  ctx.shadowColor='#38bdf8';ctx.shadowBlur=18;
  ctx.fillStyle='#60a5fa';ctx.beginPath();ctx.arc(130,y,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#bfdbfe';ctx.beginPath();ctx.arc(125,y-5,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e2e8f0';ctx.font='bold 16px sans-serif';
  ctx.fillText(`t = ${t.toFixed(2)} s`,340,70);
  ctx.fillText(`v = ${(G*t).toFixed(2)} m/s`,340,96);
  ctx.fillText(`Ep = ${(g.massa*G*sisa).toFixed(0)} J`,340,122);
  ctx.font='13px sans-serif';ctx.fillStyle='#93c5fd';
  ctx.fillText(`h = ${g.tinggi} m   m = ${g.massa} kg   g = 9,8 m/s²`,340,158);
  ctx.fillStyle = g.done ? '#34d399' : (g.running?'#fbbf24':'#94a3b8');
  ctx.font='bold 16px sans-serif';
  ctx.fillText(g.done?'✓ Sampai permukaan':(g.running?'Jatuh…':'Tekan “Jatuhkan” untuk mulai'),340,210);
}
function planetRadius(p){ return p.n==='Jupiter'?11:(p.n==='Saturnus'?10:(p.n==='Bumi'?8:6)); }
function drawSolar(){
  const c = document.getElementById('solarCanvas'); if(!c) return;
  const ctx = canvasSetup(c), cx=c.width/2, cy=c.height/2;
  ctx.shadowColor='#fbbf24';ctx.shadowBlur=34;
  ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#fef9c3';ctx.font='12px sans-serif';ctx.fillText('Matahari',cx+28,cy+4);
  ui.sim.solar.positions = [];
  PLANETS.forEach((p,i)=>{
    const r = 30 + 25*Math.pow(p.au,0.45);
    const ang = p.phase + (ui.sim.solar.years/p.period)*Math.PI*2;
    const x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r*0.55;
    ctx.strokeStyle='rgba(148,163,184,.18)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(cx,cy,r,r*0.55,0,0,Math.PI*2);ctx.stroke();
    if(p.n==='Saturnus'){
      ctx.strokeStyle=p.color;ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(x,y,15,5,0.4,0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y,planetRadius(p),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    if(i===ui.sim.solar.selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,planetRadius(p)+5,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle='#cbd5e1';ctx.font='11px sans-serif';ctx.fillText(p.n,x+12,y-9);
    ui.sim.solar.positions.push({x,y,p,i});
  });
  ctx.fillStyle='#93c5fd';ctx.font='bold 14px sans-serif';
  ctx.fillText(`Waktu: ${ui.sim.solar.years.toFixed(2)} tahun`,18,28);
}
function zig(ctx,x1,y1,x2,y2,label){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  ctx.strokeStyle='#0a1226';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y1);
  const a=0.22*len,b=0.78*len,steps=7;
  for(let k=0;k<=steps;k++){
    const d=a+(b-a)*k/steps, off=(k===0||k===steps)?0:(k%2?10:-10);
    ctx.lineTo(x1+ux*d+nx*off,y1+uy*d+ny*off);
  }
  ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle='#fde68a';ctx.font='bold 13px sans-serif';ctx.fillText(label,(x1+x2)/2+8,(y1+y2)/2-14);
}
function pointAt(path,dist){
  let total=0;
  for(let i=0;i<path.length-1;i++) total+=Math.hypot(path[i+1][0]-path[i][0],path[i+1][1]-path[i][1]);
  let d=((dist%total)+total)%total;
  for(let i=0;i<path.length-1;i++){
    const seg=Math.hypot(path[i+1][0]-path[i][0],path[i+1][1]-path[i][1]);
    if(d<=seg){const t=d/seg;return [path[i][0]+(path[i+1][0]-path[i][0])*t,path[i][1]+(path[i+1][1]-path[i][1])*t];}
    d-=seg;
  }
  return path[0];
}
function pathLength(path){
  let s=0;for(let i=0;i<path.length-1;i++)s+=Math.hypot(path[i+1][0]-path[i][0],path[i+1][1]-path[i][1]);return s;
}
function drawCircuit(phase){
  const c = document.getElementById('circCanvas'); if(!c) return;
  const ctx = canvasSetup(c), cal = circuitCalc(), s = ui.sim.circ;
  const paths = s.mode==='seri'
    ? [[[120,250],[120,70],[680,70],[680,310],[120,310],[120,250]]]
    : [[[120,250],[120,70],[320,70],[320,310],[120,310],[120,250]],
       [[120,250],[120,70],[520,70],[520,310],[120,310],[120,250]]];
  ctx.strokeStyle='#38bdf8';ctx.lineWidth=4;ctx.lineJoin='round';
  paths.forEach(path=>{ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();});
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(98,180);ctx.lineTo(142,180);ctx.stroke();
  ctx.beginPath();ctx.moveTo(106,222);ctx.lineTo(134,222);ctx.stroke();
  ctx.fillStyle='#93c5fd';ctx.font='bold 13px sans-serif';ctx.fillText('+',150,186);ctx.fillText('−',150,228);
  ctx.fillStyle='#fde68a';ctx.fillText(`${s.v} V`,72,206);
  if(s.mode==='seri'){
    zig(ctx,300,70,430,70,`R1 ${s.r1}Ω`);
    zig(ctx,430,310,300,310,`R2 ${s.r2}Ω`);
  }else{
    zig(ctx,320,130,320,220,`R1 ${s.r1}Ω`);
    zig(ctx,520,130,520,220,`R2 ${s.r2}Ω`);
  }
  const speeds = s.mode==='seri'?[cal.I]:[cal.i1,cal.i2];
  paths.forEach((path,pi)=>{
    const len=pathLength(path), spacing=64, speed=18+Math.min(speeds[pi],10)*14;
    for(let k=0;k<Math.floor(len/spacing);k++){
      const [x,y]=pointAt(path,phase*(speed/30)+k*spacing+pi*17);
      ctx.fillStyle='#22d3ee';ctx.shadowColor='#22d3ee';ctx.shadowBlur=9;
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
  });
  ctx.fillStyle='#e2e8f0';ctx.font='bold 15px sans-serif';
  ctx.fillText(`R = ${cal.R.toFixed(2)} Ω`,380,380);
  ctx.fillText(`I = ${cal.I.toFixed(2)} A`,520,380);
  ctx.fillStyle='#93c5fd';ctx.font='12px sans-serif';ctx.fillText(s.mode==='seri'?'Rangkaian Seri':'Rangkaian Paralel',360,30);
}

function initSim(){
  const tab=ui.sim.tab;

function initGrav(){
  const g=ui.sim.grav; let raf,last=performance.now();
  function loop(ts){
    const dt=Math.min((ts-last)/1000,0.05);last=ts;
    if(g.running){
      g.t+=dt;const tf=Math.sqrt(2*g.tinggi/G);
      if(g.t>=tf){g.t=tf;g.running=false;g.done=true;}
    }
    drawGrav();updateGravReadouts();raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  cleanups.push(()=>cancelAnimationFrame(raf));
}
function initSolar(){
  let raf,last=performance.now();
  const c=document.getElementById('solarCanvas');
  function loop(ts){
    const dt=Math.min((ts-last)/1000,0.05);last=ts;
    if(ui.sim.solar.playing) ui.sim.solar.years+=dt*ui.sim.solar.speed;
    drawSolar();setText('solarTimeVal',ui.sim.solar.years.toFixed(2));
    raf=requestAnimationFrame(loop);
  }
  function onClick(e){
    const rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)*(c.width/rect.width),y=(e.clientY-rect.top)*(c.height/rect.height);
    let best=-1,bd=22;
    ui.sim.solar.positions.forEach(p=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p.i;}});
    if(best>=0){ui.sim.solar.selected=best;const info=document.getElementById('solarInfo');if(info)info.innerHTML=solarInfoHTML();}
  }
  c.addEventListener('click',onClick);
  raf=requestAnimationFrame(loop);
  cleanups.push(()=>{cancelAnimationFrame(raf);c.removeEventListener('click',onClick);});
}
function initCircuit(){
  let raf,last=performance.now(),phase=0;

    const dt=Math.min((ts-last)/1000,0.05);last=ts;
    phase+=dt*60;drawCircuit(phase);updateCircuitReadouts();
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  cleanups.push(()=>cancelAnimationFrame(raf));
}

      ui.sim.grav.tinggi=Number(v);ui.sim.grav.t=0;ui.sim.grav.running=false;ui.sim.grav.done=false;
      setText('gravHeightVal',v);updateGravReadouts();break;
    case 'solar-speed': ui.sim.solar.speed=Number(v);setText('solarSpeedVal',Number(v).toFixed(1));break;
    case 'circ-v': ui.sim.circ.v=Number(v);setText('circVVal',v);updateCircuitReadouts();markSim('rangkaian');break;
    case 'circ-r1': ui.sim.circ.r1=Number(v);setText('circR1Val',v);updateCircuitReadouts();markSim('rangkaian');break;
    case 'circ-r2': ui.sim.circ.r2=Number(v);setText('circR2Val',v);updateCircuitReadouts();markSim('rangkaian');break;
    case 'guru-search': ui.guruQuery=v;render();
      document.getElementById('guruSearch')?.focus();break;
  }
});
document.addEventListener('submit',(e)=>{
  if(e.target.id==='loginForm'){
    e.preventDefault();
    doLogin();
  }
});
document.addEventListener('keydown',(e)=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-action="buka-materi"]')){
    e.preventDefault();go('#/materi/'+e.target.dataset.id);
  }
  if(e.key==='Enter' && e.target.id==='namaSiswaBaru'){
    e.preventDefault();tambahSiswa();
  }
});
window.addEventListener('hashchange',render);

/* ================= Boot ================= */
document.documentElement.dataset.theme=state.theme;
if(!location.hash) location.hash='#/dashboard';
render();

</script>
</body>
</html>
